
name: CloudCart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Allow GitHub Actions to request an OIDC token
permissions:
  id-token: write
  contents: read

jobs:
  basic-check:
    name: Verify Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Repository Contents
        run: |
          echo "Starting CloudCart CI pipeline"
          pwd
          ls -la
          echo "CloudCart repository checkout successful"

      - name: Build Product Service Image
        run: docker build -t cloudcart-product-service:ci ./services/product-service

      - name: Build Order Service Image
        run: docker build -t cloudcart-order-service:ci ./services/order-service

      # Authenticate to AWS using temporary OIDC credentials
      - name: Configure AWS Credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::063562647105:role/cloudcart-github-actions-ecr-role
          aws-region: us-east-1

      # Confirm GitHub Actions assumed the correct IAM role
      - name: Verify AWS Identity
        if: github.event_name == 'push'
        run: aws sts get-caller-identity

      # Authenticate Docker to Amazon ECR
      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      # Build, tag, and push the Product Service image
      - name: Push Product Service to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: 063562647105.dkr.ecr.us-east-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/cloudcart-product-service:$IMAGE_TAG \
            ./services/product-service

          docker push \
            $ECR_REGISTRY/cloudcart-product-service:$IMAGE_TAG

      # Build, tag, and push the Order Service image
      - name: Push Order Service to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: 063562647105.dkr.ecr.us-east-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/cloudcart-order-service:$IMAGE_TAG \
            ./services/order-service

          docker push \
            $ECR_REGISTRY/cloudcart-order-service:$IMAGE_TAG
