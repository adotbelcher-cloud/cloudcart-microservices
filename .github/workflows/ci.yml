name: CloudCart CI

# Allow GitHub Actions to request an AWS OIDC token
permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  basic-check:
    name: Verify Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Repository Contents
        run: |
          echo "Starting CloudCart CI pipeline"
          pwd
          ls -la
          echo "CloudCart repository checkout successful"

      - name: Build Product Service Image
        run: docker build -t cloudcart-product-service:ci ./services/product-service

      - name: Build Order Service Image
        run: docker build -t cloudcart-order-service:ci ./services/order-service

      # Exchange the GitHub OIDC token for temporary AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::063562647105:role/cloudcart-github-actions-ecr-role
          aws-region: us-east-1

      # Confirm the workflow successfully authenticated to AWS
      - name: Verify AWS Identity
        run: aws sts get-caller-identity