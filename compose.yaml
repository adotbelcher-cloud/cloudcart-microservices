# Defines the containers required for our local development environment
services:
  # FastAPI Product Service
  product-service:
    # Build the Product Service image from its Dockerfile
    build:
      context: ./services/product-service

    # Give the container a predictable name for local troubleshooting
    container_name: cloudcart-product-service

    # Map the Product Service port to our local machine
    # host_port:container_port
    ports:
      - "8000:8000"

    # Runtime configuration passed into the Product Service container
    environment:
      DATABASE_URL: postgresql+psycopg://ecommerce_user:ecommerce_password@postgres:5432/ecommerce

    # Wait until PostgreSQL is healthy before starting the Product Service
    depends_on:
      postgres:
        condition: service_healthy

    # Verify that the FastAPI application is responding
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # FastAPI Order Service
  order-service:
    # Build the Order Service image from its Dockerfile
    build:
      context: ./services/order-service

    # Give the container a predictable name for local troubleshooting
    container_name: cloudcart-order-service

    # Map host port 8001 to port 8000 inside the container
    ports:
      - "8001:8000"

    # Verify that the FastAPI application is responding
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    # Runtime configuration passed into the Order Service container
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8000
      DATABASE_URL: postgresql+psycopg://ecommerce_user:ecommerce_password@postgres:5432/ecommerce

  # PostgreSQL database used by the Product Service
  postgres:
    # Use the official PostgreSQL 17 image from Docker Hub
    image: postgres:17

    # Give the container a predictable name for local troubleshooting
    container_name: ecommerce-postgres

    # Environment variables used by PostgreSQL during initialization
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password

    # Map PostgreSQL's container port to our local machine
    # host_port:container_port
    ports:
      - "5432:5432"

    # Persist database files outside the lifecycle of the container
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    # Reuse the PostgreSQL volume created before the project was renamed
    external: true
    name: aws-containerized-ecommerce_postgres_data
